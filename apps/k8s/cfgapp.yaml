# App de configuracao (T4): devolve em JSON o que recebeu por variaveis de ambiente (nao expoe a senha).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfgapp
  labels: {app: cfgapp, ex288-lab: v3}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cfgapp}
  template:
    metadata:
      labels: {app: cfgapp}
    spec:
      containers:
        - name: cfgapp
          image: registry.access.redhat.com/ubi9/nodejs-22-minimal:latest
          command: ["node", "-e"]
          args:
            - |
              require('http').createServer((q, s) => {
                const e = process.env;
                s.setHeader('content-type', 'application/json');
                s.end(JSON.stringify({ greeting: e.GREETING || null, lang: e.LANG_CODE || null,
                  dbUser: e.DB_USER || null, hasPassword: !!e.DB_PASSWORD, hasToken: !!e.API_TOKEN,
                  appHost: e.APP_HOST || null, apiHost: e.API_HOST || null }) + '\n');
              }).listen(8080);
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cfgapp
  labels: {app: cfgapp, ex288-lab: v3}
spec:
  selector: {app: cfgapp}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cfgapp
  labels: {app: cfgapp, ex288-lab: v3}
spec:
  to: {kind: Service, name: cfgapp}
