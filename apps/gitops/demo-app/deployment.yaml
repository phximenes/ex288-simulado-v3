apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitops-demo}
  template:
    metadata:
      labels: {app: gitops-demo}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/nodejs-22-minimal:latest
          env:
            - {name: MESSAGE, value: "gitops v1"}
          command: ["node", "-e"]
          args:
            - "require('http').createServer((q,s)=>s.end(process.env.MESSAGE+'\\n')).listen(8080)"
          ports:
            - containerPort: 8080
